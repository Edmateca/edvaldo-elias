<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<title>Galeria | ED MATECA</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<header class="topbar">
<!-- header padrão -->
</header>

<main>

<section class="hero">

<div class="container">

<h1 class="hero-title">

Galeria de Projetos e Conquistas

</h1>

<p>

Um registro das experiências que transformam
conhecimento em prática.

</p>

</div>

</section>

<section class="section">

<div class="container">

<div class="gallery-filters">

<button class="filter-btn active" data-filter="all">
Todos
</button>

<button class="filter-btn" data-filter="olimpiadas">
Olimpíadas
</button>

<button class="filter-btn" data-filter="robotica">
Robótica
</button>

<button class="filter-btn" data-filter="maker">
Impressão 3D
</button>

<button class="filter-btn" data-filter="aulas">
Sala de Aula
</button>

</div>

<div class="gallery-grid">

<div class="gallery-item" data-category="olimpiadas">

<img
src="assets/profile-placeholder.png"
alt="OMASP"
class="gallery-image"
data-caption="Participação em olimpíadas acadêmicas.">

</div>

<div class="gallery-item" data-category="robotica">

<img
src="assets/profile-placeholder.png"
alt="Robótica"
class="gallery-image"
data-caption="Projetos de robótica educacional.">

</div>

<div class="gallery-item" data-category="maker">

<img
src="assets/profile-placeholder.png"
alt="Impressão 3D"
class="gallery-image"
data-caption="Prototipagem educacional.">

</div>

</div>

</div>

</section>

</main>

<div id="lightbox" class="lightbox">

<button class="lightbox-close">×</button>

<button class="lightbox-prev">❮</button>

<img
id="lightboxImage"
class="lightbox-image">

<button class="lightbox-next">❯</button>

<div id="lightboxCaption" class="lightbox-caption"></div>

</div>

<footer class="footer">
<strong>ED MATECA</strong>
</footer>

<script src="script.js"></script>

</body>
</html>
